name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend-web/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend-web/**'

jobs:
  react-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Install Dependencies
      run: |
        cd frontend-web
        npm install

    - name: Run tests
      run: |
        cd frontend-web
        npm test -- --watchAll=false