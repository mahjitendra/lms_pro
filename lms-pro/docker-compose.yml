version: '3.8'

services:
  # Backend (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: lms_pro_backend
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis

  # Frontend (React)
  frontend:
    build:
      context: ./frontend-web
      dockerfile: ../docker/frontend/Dockerfile
    container_name: lms_pro_frontend
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Python ML Service
  python-ml:
    build:
      context: ./backend/python_ml
      dockerfile: ../../docker/python-ml/Dockerfile
    container_name: lms_pro_python_ml
    volumes:
      - ./backend/python_ml:/app
    ports:
      - "5000:5000"

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: lms_pro_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3306:3306"
    volumes:
      - ./docker/data/db:/var/lib/mysql

  # Redis
  redis:
    image: redis:6.2-alpine
    container_name: lms_pro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Nginx (as a reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: lms_pro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
    driver: local